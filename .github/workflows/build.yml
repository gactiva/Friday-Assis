
name: Build Friday Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Friday V3 project
        run: |
          unzip "FridayAssistantNext3.zip" -d project
          cp -a project/. .
          rm -rf project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Download offline English speech model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -o /tmp/vosk-model.zip
          mkdir -p /tmp/vosk-model
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model
          mkdir -p app/src/main/assets/model
          cp -a /tmp/vosk-model/vosk-model-small-en-us-0.15/. \
            app/src/main/assets/model/
          test -f app/src/main/assets/model/conf/model.conf
          echo "Offline model files verified."

      - name: Build Friday APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Friday-v3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
