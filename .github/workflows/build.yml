
name: Build Friday Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Friday V3 project
        run: |
          unzip "FridayAssistantNext3.zip" -d project
          cp -a project/. .
          rm -rf project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Download and package offline model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -o /tmp/vosk-model.zip
          mkdir -p /tmp/vosk-download
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-download
          cd /tmp/vosk-download/vosk-model-small-en-us-0.15
          zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/model.zip" .
          cd "$GITHUB_WORKSPACE"
          test -s app/src/main/assets/model.zip
          unzip -l app/src/main/assets/model.zip | head -20
          echo "Offline model ZIP created."

      - name: Build Friday APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Friday-v3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
